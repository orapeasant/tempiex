tempiex:
  address: "localhost:8133"
  namespace: "default"
  tls:
    enabled: false
  apiKey: ""

workers:
  - taskQueue: "worker-default"
    maxConcurrentActivities: 10
    maxConcurrentWorkflowTasks: 5

api:
  enabled: true
  host: "0.0.0.0"
  port: 8090
  corsOrigins:
    - "http://localhost:8080"

runs:
  storePath: "./worker-runs.db"
  maxCompletedRuns: 1000

metrics:
  otel:
    endpoint: "localhost:4317"
    insecure: true

log:
  level: "info"
  format: "json"
