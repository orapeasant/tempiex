[project]
name = "tempiex"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.72.0",
    "protobuf>=5.29.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.72.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
